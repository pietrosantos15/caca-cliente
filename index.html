<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garimpo Local</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app" data-view="map">
<aside>
  <div class="head"><div><b>🎯 Garimpo Local</b><small>Encontre negócios sem site</small></div><button id="theme" title="Tema" type="button">🌙</button></div>
  <form class="ctl" id="f">
    <input id="niche" list="nl" placeholder="Nicho (ex.: dentista, pet shop…)" required autocomplete="off">
    <datalist id="nl"></datalist>
    <input id="city" placeholder="Cidade, Estado" required>
    <label style="grid-template-columns:auto 1fr;align-items:center;gap:10px">Raio: <span><b id="rv">5</b> km</span><input id="radius" type="range" min="1" max="30" value="5" style="grid-column:1/3;padding:0"></label>
    <button class="pri" id="go">Buscar leads sem site</button>
  </form>
  <div class="ctl">
    <div class="tabs">
      <button class="on" data-v="map" type="button">🗺️ Mapa</button>
      <button data-v="kanban" type="button">📋 Kanban</button>
      <button data-v="dash" type="button">📊 Painel</button>
    </div>
    <button class="dash-btn" id="editMsg" type="button">✏️ Editar mensagem do WhatsApp</button>
    <button class="dash-btn" id="hist" type="button">📁 Buscas salvas</button>
    <button class="dash-btn" id="cloud" type="button">☁️ Conectar banco online</button>
    <button class="dash-btn" id="imp" type="button">📥 Importar lista (CNPJ / planilha)</button>
  </div>
  <div class="stats" id="stats">Faça uma busca para começar.</div>
  <div class="exp" id="exp" hidden>Exportar: <button class="pill" id="csv" type="button">CSV</button><button class="pill" id="xlsx" type="button">Excel</button></div>
  <div class="ctl" id="filters" hidden style="padding-bottom:0">
    <label style="grid-template-columns:auto 1fr;align-items:center">Ordenar
      <select id="sort"><option value="score">Relevância (score)</option><option value="dist">Distância</option><option value="name">Nome (A–Z)</option></select></label>
  </div>
  <div class="chips" id="chips" hidden style="padding-top:8px">
    <button class="chip" data-f="wa" type="button">📞 WhatsApp</button>
    <button class="chip" data-f="ig" type="button">📷 Instagram</button>
    <button class="chip" data-f="em" type="button">✉️ E-mail</button>
    <button class="chip" data-f="site" type="button">⚠️ Incluir quem tem site</button>
  </div>
  <div class="chips" id="tempChips" hidden style="padding-top:0">
    <button class="chip t-hot" data-t="hot" type="button">🔥 Quente <span></span></button>
    <button class="chip t-warm" data-t="warm" type="button">🌤️ Morno <span></span></button>
    <button class="chip t-cold" data-t="cold" type="button">❄️ Frio <span></span></button>
  </div>
  <div class="ctl" id="fireWrap" hidden style="padding-bottom:10px"><button class="fire" id="fire" type="button"></button></div>
  <div id="list"></div>
  <div class="foot">Dados © colaboradores do <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · Powered by <a href="https://www.geoapify.com/" target="_blank" rel="noopener">Geoapify</a> · v1.0</div>
</aside>
<main>
  <div id="msgbar" hidden></div>
  <div id="map"></div>
  <div class="view" id="kanban"></div>
  <div class="view" id="dash"></div>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
